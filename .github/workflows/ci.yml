name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # api 集成测试（runs/files/tasks/audit-injection）依赖 PostgreSQL
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fap
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本取自根 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm lint
      - run: pnpm --filter @platform/api build
      - run: pnpm --filter @platform/web build
      - run: pnpm -r --if-present test
